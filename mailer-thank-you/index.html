<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You | Adonis Kitchen &amp; Bath</title>
    <meta name="description" content="Thank you for requesting your free design consultation with Adonis Kitchen &amp; Bath." />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Postcard campaign page: intentionally no Google Tag Manager or other ad/analytics tracking. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: light;
        --blue: #0677d8;
        --blue-dark: #006fc9;
        --white: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px 0;
        color: var(--white);
        background:
          linear-gradient(90deg, rgba(4, 14, 22, 0.88), rgba(4, 14, 22, 0.76)),
          url("assets/kitchen-banner.jpg") center / cover no-repeat;
        background-color: #06121d;
        font-family: "Open Sans", Arial, Helvetica, sans-serif;
      }

      main {
        width: min(100% - 32px, 620px);
        padding: 38px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 6px;
        background: rgba(6, 18, 29, 0.94);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
        text-align: center;
      }

      img {
        width: 190px;
        height: auto;
        margin-bottom: 28px;
      }

      h1 {
        margin: 0 0 14px;
        font-family: "DM Serif Display", Georgia, "Times New Roman", serif;
        font-size: clamp(38px, 7vw, 56px);
        line-height: 1.04;
        font-weight: 400;
      }

      p {
        margin: 0 auto;
        max-width: 480px;
        color: rgba(255, 255, 255, 0.9);
        font-size: 17px;
        line-height: 1.6;
      }

      p strong {
        color: var(--white);
      }

      p + p {
        margin-top: 14px;
      }

      p a {
        color: var(--white);
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .actions {
        display: flex;
        justify-content: center;
        margin-top: 28px;
      }

      .actions a {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 22px;
        border-radius: 4px;
        color: var(--white);
        background: linear-gradient(180deg, var(--blue), var(--blue-dark));
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
      }

      @media (max-width: 520px) {
        main {
          padding: 30px 22px;
        }

        .actions a {
          width: 100%;
        }
      }
      .actions a {
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }

      .actions a:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(6, 119, 216, 0.38);
      }

      @keyframes ty-up {
        from { opacity: 0; transform: translateY(24px) scale(0.98); }
        to { opacity: 1; transform: none; }
      }

      @media (prefers-reduced-motion: no-preference) {
        main {
          animation: ty-up 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        main > * {
          animation: ty-up 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        main > :nth-child(2) { animation-delay: 0.15s; }
        main > :nth-child(3) { animation-delay: 0.25s; }
        main > :nth-child(4) { animation-delay: 0.35s; }
        main > :nth-child(5) { animation-delay: 0.45s; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/adonis-logo.png" alt="Adonis Kitchen &amp; Bath" />
      <h1>Thank You</h1>
      <p><strong>Thank you. We&rsquo;ve received your request.</strong> A member of our design team will contact you within one business day to schedule your free design consultation and discuss your offer.</p>
      <p>Questions in the meantime? Call us at <a href="tel:3307345727">(330) 734-5727</a>.</p>
      <div class="actions">
        <a href="tel:3307345727">Call (330) 734-5727</a>
      </div>
    </main>
  </body>
</html>
